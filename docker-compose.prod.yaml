x-back-common: &back-common
  image: ghcr.io/adam-nlem/maker-flow-back:latest
  restart: unless-stopped
  environment: &back-env
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET}
    APP_DOMAIN: ${APP_DOMAIN}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    DATABASE_NAME: ${MYSQL_DATABASE}
    DATABASE_HOST: ${MYSQL_DATABASE_HOST}
    DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    REDIS_STORE_HOST: ${REDIS_STORE_HOST}
    REDIS_STORE_PORT: ${REDIS_STORE_PORT}
    REDIS_STORE_SCHEME: ${REDIS_STORE_SCHEME}
    REDIS_STORE_PASSWORD: ${REDIS_STORE_PASSWORD}

    MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}/messages

    INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
    INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
    INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI}
    FRONTEND_URL: ${FRONTEND_URL}

    YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
    YOUTUBE_PROJECT_ID: ${YOUTUBE_PROJECT_ID}
    YOUTUBE_AUTH_URI: ${YOUTUBE_AUTH_URI}
    YOUTUBE_TOKEN_URI: ${YOUTUBE_TOKEN_URI}
    YOUTUBE_AUTH_PROVIDER_X509_CERT_URL: ${YOUTUBE_AUTH_PROVIDER_X509_CERT_URL}
    YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
    YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI}
    YOUTUBE_JAVASCRIPT_ORIGIN: ${YOUTUBE_JAVASCRIPT_ORIGIN}

    GEMINI_API_KEY: ${GEMINI_API_KEY}
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

    SENTRY_DSN: ${SENTRY_DSN_BACK}

    RESEND_API_KEY: ${RESEND_API_KEY}
    MAILING_FROM_ADDRESS: ${MAILING_FROM_ADDRESS}
    MAILING_FROM_NAME: ${MAILING_FROM_NAME}

    PRELAUNCH_ENABLED: ${PRELAUNCH_ENABLED}

services:
  watchtower:
    image: containrrr/watchtower
    command:
      - "--label-enable"
      - "--interval"
      - "30"
      - "--rolling-restart"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  reverse-proxy:
    image: traefik:v3
    command:
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.makerflow.acme.tlschallenge=true"
      - "--certificatesresolvers.makerflow.acme.email=adam@maker-flow.com"
      - "--certificatesresolvers.makerflow.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Cloudflare IPs — allows Traefik to restore real visitor IPs from CF-Connecting-IP header
      # CLOUDFLARE_IPS defined in .env.prod — update from https://www.cloudflare.com/ips-v4/#
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=${CLOUDFLARE_IPS}"
      - "--entryPoints.web.forwardedHeaders.trustedIPs=${CLOUDFLARE_IPS}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock

  front:
    image: ghcr.io/adam-nlem/maker-flow-front:latest
    restart: unless-stopped
    networks:
      - maker_flow
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.makerflow-front.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.makerflow-front.entrypoints=websecure"
      - "traefik.http.routers.makerflow-front.tls.certresolver=makerflow"
      - "com.centurylinklabs.watchtower.enable=true"

  back:
    <<: *back-common
    environment:
      <<: *back-env
    networks:
      - maker_flow
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.makerflow-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.makerflow-api.entrypoints=websecure"
      - "traefik.http.routers.makerflow-api.tls.certresolver=makerflow"
      - "com.centurylinklabs.watchtower.enable=true"

  worker:
    <<: *back-common
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    networks:
      - maker_flow
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      back:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-store:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-connections=100
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
      --default-authentication-plugin=mysql_native_password
    volumes:
      - maker_flow_db_data:/var/lib/mysql
    networks:
      - maker_flow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis-store:
    image: redis:8.4.0
    container_name: ${COMPOSE_PROJECT_NAME}_redis_store
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_STORE_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - maker_flow_redis_data:/data
    networks:
      - maker_flow
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_STORE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - maker_flow_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - maker_flow
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  maker_flow_db_data:
  maker_flow_rabbitmq_data:
  maker_flow_redis_data:
  letsencrypt:

networks:
  maker_flow:
    driver: bridge