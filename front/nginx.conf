server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /maker-flow/ {
        try_files $uri $uri/ /maker-flow/index.html;
    }

    location /maker-flow/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        return 301 /maker-flow/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
