services:

  front:
    # We don't use the Dockerfile in the React project because it is for Prod env
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_front
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VITE_API_URL=${API_URL}
    networks:
      - maker_flow
    depends_on:
      - back
    command: sh -c "npm ci && npm run dev"

  back:
    build:
      context: ./back
      dockerfile: .docker/build/Dockerfile
      args:
        APP_ENV: ${APP_ENV}
    container_name: ${COMPOSE_PROJECT_NAME}_back
    restart: unless-stopped
    volumes:
      - ./back:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      APP_DOMAIN: ${APP_DOMAIN}
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_HOST: ${MYSQL_DATABASE_HOST}
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "80:80"
    networks:
      - maker_flow
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - maker_flow_db_data:/var/lib/mysql
    networks:
      - maker_flow

  pma:
    image: arm64v8/phpmyadmin
    container_name: ${COMPOSE_PROJECT_NAME}_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${PMA_MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - maker_flow

volumes:
  maker_flow_db_data:

networks:
  maker_flow: