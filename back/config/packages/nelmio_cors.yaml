nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ["%env(CORS_ALLOW_ORIGIN)%"]
        allow_credentials: true
        allow_methods:
            ["OPTIONS", "HEAD", "GET", "POST", "PUT", "PATCH", "DELETE"]
        allow_headers:
            ["*", "Content-Type", "Authorization", "Origin", "X-Timezone"]
        expose_headers: ["Link"]
        max_age: 3600
    paths:
        "^/": null
