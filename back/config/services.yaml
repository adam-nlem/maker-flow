# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.domain: "%env(string:APP_DOMAIN)%"
    app.frontend_url: "%env(string:FRONTEND_URL)%"

    app.instagram.graph_url: "https://graph.instagram.com"
    app.instagram.authorization_url: "https://www.instagram.com/oauth/authorize"
    app.instagram.token_url: "https://api.instagram.com/oauth/access_token"

    app.instagram.app_id: "%env(string:INSTAGRAM_APP_ID)%"
    app.instagram.app_secret: "%env(string:INSTAGRAM_APP_SECRET)%"
    app.instagram.redirect_uri: "%env(string:INSTAGRAM_REDIRECT_URI)%"

    app.gemini.api_key: "%env(string:GEMINI_API_KEY)%"
    app.openai.api_key: "%env(string:OPENAI_API_KEY)%"
    app.claude.api_key: "%env(string:ANTHROPIC_API_KEY)%"

    app.stripe.secret_key: "%env(string:STRIPE_SECRET_KEY)%"
    app.stripe.webhook_secret: "%env(string:STRIPE_WEBHOOK_SECRET)%"

    app.redis_store.scheme: "%env(string:REDIS_STORE_SCHEME)%"
    app.redis_store.host: "%env(string:REDIS_STORE_HOST)%"
    app.redis_store.port: "%env(string:REDIS_STORE_PORT)%"
    app.redis_store.password: "%env(string:REDIS_STORE_PASSWORD)%"

    app.youtube.client_id: "%env(string:YOUTUBE_CLIENT_ID)%"
    app.youtube.project_id: "%env(string:YOUTUBE_PROJECT_ID)%"
    app.youtube.auth_uri: "%env(string:YOUTUBE_AUTH_URI)%"
    app.youtube.token_uri: "%env(string:YOUTUBE_TOKEN_URI)%"
    app.youtube.auth_provider_x509_cert_url: "%env(string:YOUTUBE_AUTH_PROVIDER_X509_CERT_URL)%"
    app.youtube.client_secret: "%env(string:YOUTUBE_CLIENT_SECRET)%"
    app.youtube.redirect_uri: "%env(string:YOUTUBE_REDIRECT_URI)%"
    app.youtube.javascript_origin: "%env(string:YOUTUBE_JAVASCRIPT_ORIGIN)%"

    app.tiktok.authorization_url: "https://www.tiktok.com/v2/auth/authorize/"
    app.tiktok.token_url: "https://open.tiktokapis.com/v2/oauth/token/"
    app.tiktok.api_url: "https://open.tiktokapis.com"
    app.tiktok.client_key: "%env(string:TIKTOK_CLIENT_KEY)%"
    app.tiktok.client_secret: "%env(string:TIKTOK_CLIENT_SECRET)%"
    app.tiktok.redirect_uri: "%env(string:TIKTOK_REDIRECT_URI)%"

    app.encryption.token_key: "%env(string:APP_ENCRYPTION_KEY)%"

    app.resend.api_key: "%env(string:RESEND_API_KEY)%"
    app.mailing.from_address: "%env(string:MAILING_FROM_ADDRESS)%"
    app.mailing.from_name: "%env(string:MAILING_FROM_NAME)%"

    app.prelaunch.enabled: "%env(bool:PRELAUNCH_ENABLED)%"
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"

    ### Normalizers ###
    App\Serializer\UserTimezoneDateTimeNormalizer:
        arguments:
            $dateTimeNormalizer: '@serializer.normalizer.datetime'
        tags: ['serializer.normalizer']

    App\Service\Cookie\CookieService:
        arguments:
            $appDomain: "%app.domain%"
    App\Service\RedisStore\RedisStoreService:
        arguments:
            $scheme: "%app.redis_store.scheme%"
            $host: "%app.redis_store.host%"
            $port: "%app.redis_store.port%"
            $password: "%app.redis_store.password%"

    App\Service\Integration\InstagramOAuthService:
        arguments:
            $instagramGraphUrl: "%app.instagram.graph_url%"
            $instagramAuthorizationUrl: "%app.instagram.authorization_url%"
            $instagramTokenUrl: "%app.instagram.token_url%"
            $instagramAppId: "%app.instagram.app_id%"
            $instagramAppSecret: "%app.instagram.app_secret%"
            $instagramRedirectUri: "%app.instagram.redirect_uri%"

    Google\Client:
        autowire: false

    App\Service\Integration\YoutubeOAuthService:
        arguments:
            $youtubeClientId: "%app.youtube.client_id%"
            $youtubeProjectId: "%app.youtube.project_id%"
            $youtubeAuthUri: "%app.youtube.auth_uri%"
            $youtubeTokenUri: "%app.youtube.token_uri%"
            $youtubeAuthProviderX509CertUrl: "%app.youtube.auth_provider_x509_cert_url%"
            $youtubeClientSecret: "%app.youtube.client_secret%"
            $youtubeRedirectUri: "%app.youtube.redirect_uri%"
            $youtubeJavascriptOrigin: "%app.youtube.javascript_origin%"

    App\Service\Integration\TiktokOAuthService:
        arguments:
            $tiktokAuthorizationUrl: "%app.tiktok.authorization_url%"
            $tiktokTokenUrl: "%app.tiktok.token_url%"
            $tiktokApiUrl: "%app.tiktok.api_url%"
            $tiktokClientKey: "%app.tiktok.client_key%"
            $tiktokClientSecret: "%app.tiktok.client_secret%"
            $tiktokRedirectUri: "%app.tiktok.redirect_uri%"

    App\Controller\IntegrationController:
        arguments:
            $frontendUrl: "%app.frontend_url%"
    App\Service\GeminiClient\GeminiClientService:
        arguments:
            $geminiApiKey: "%app.gemini.api_key%"
    App\Service\AiClient\OpenAiClientService:
        arguments:
            $openAiApiKey: "%app.openai.api_key%"
    App\Service\AiClient\ClaudeClientService:
        arguments:
            $claudeApiKey: "%app.claude.api_key%"
    App\Service\Stripe\StripeCheckoutService:
        arguments:
            $stripeSecretKey: "%app.stripe.secret_key%"
            $frontendUrl: "%app.frontend_url%"
    App\Service\Stripe\StripeWebhookService:
        arguments:
            $stripeSecretKey: "%app.stripe.secret_key%"
            $stripeWebhookSecret: "%app.stripe.webhook_secret%"
    App\Service\Stripe\StripeSubscriptionService:
        arguments:
            $stripeSecretKey: "%app.stripe.secret_key%"
    App\Service\Stripe\StripePlanService:
        arguments:
            $stripeSecretKey: "%app.stripe.secret_key%"
    App\Service\Stripe\StripeRefillService:
        arguments:
            $stripeSecretKey: "%app.stripe.secret_key%"
    App\Service\Encryption\TokenEncryptionService:
        arguments:
            $encryptionKey: "%app.encryption.token_key%"
    Resend\Client:
        factory: ['Resend', 'client']
        arguments: ['%app.resend.api_key%']

    App\Service\Mailing\MailingService:
        arguments:
            $fromAddress: "%app.mailing.from_address%"
            $fromName: "%app.mailing.from_name%"
            $resendApiLimiter: '@limiter.resend_api'
    App\EventSubscriber\IntegrationTokenExpiredSubscriber:
        arguments:
            $frontendUrl: "%app.frontend_url%"

    App\Service\Prelaunch\PrelaunchService:
        arguments:
            $prelaunchEnabled: "%app.prelaunch.enabled%"
    App\Controller\PrelaunchController:
        arguments:
            $prelaunchEnabled: "%app.prelaunch.enabled%"

    App\EventListener\IntegrationTokenEncryptionListener:
        tags:
            - { name: 'doctrine.orm.entity_listener', event: 'postLoad', entity: 'App\Entity\Integration', lazy: true }
            - { name: 'doctrine.orm.entity_listener', event: 'prePersist', entity: 'App\Entity\Integration', lazy: true }
            - { name: 'doctrine.orm.entity_listener', event: 'preUpdate', entity: 'App\Entity\Integration', lazy: true }
            - { name: 'doctrine.orm.entity_listener', event: 'postPersist', entity: 'App\Entity\Integration', lazy: true }
            - { name: 'doctrine.orm.entity_listener', event: 'postUpdate', entity: 'App\Entity\Integration', lazy: true }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
